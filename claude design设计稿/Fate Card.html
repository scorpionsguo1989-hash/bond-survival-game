<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运卡 · 债市生存游戏</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="fate-card.css">
<style>
  html, body { background: #07090f; }
  /* DC artboard 视觉补丁：每张 artboard 是终端深底 */
  [data-dc-slot] .dc-card { background: #0a0e1a !important; border: 1px solid rgba(120,140,200,0.18) !important; box-shadow: 0 6px 24px rgba(0,0,0,0.5) !important; }
  /* DC chrome 字色适配深底 */
  .dc-labeltext, .dc-labeltext .dc-editable { color: rgba(230,235,245,0.78) !important; }
  .dc-grip svg, .dc-expand, .dc-delete { color: rgba(152,163,189,0.7) !important; }
  .dc-section-title, .dc-section-subtitle { color: rgba(230,235,245,0.85) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="fate-card.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="desktop"
        title="命运卡 · 桌面"
        subtitle="1280×900 · 三角色主色分支（CFO 青蓝 / IM 金黄 / GOV 朱红）"
      >
        <DCArtboard id="cfo-d" label="CFO · 桌面" width={1280} height={900}>
          <FateCard role="cfo" variant="desktop" />
        </DCArtboard>
        <DCArtboard id="im-d" label="IM · 桌面" width={1280} height={900}>
          <FateCard role="im" variant="desktop" />
        </DCArtboard>
        <DCArtboard id="gov-d" label="GOV · 桌面" width={1280} height={900}>
          <FateCard role="gov" variant="desktop" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="mobile"
        title="命运卡 · 移动端"
        subtitle="375 宽 · 内容自然撑开（页面滚动，非卡片内部滚动）"
      >
        <DCArtboard id="cfo-m" label="CFO · 移动" width={375} height={1280}>
          <FateCard role="cfo" variant="mobile" />
        </DCArtboard>
        <DCArtboard id="im-m" label="IM · 移动" width={375} height={1280}>
          <FateCard role="im" variant="mobile" />
        </DCArtboard>
        <DCArtboard id="gov-m" label="GOV · 移动" width={375} height={1280}>
          <FateCard role="gov" variant="mobile" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
