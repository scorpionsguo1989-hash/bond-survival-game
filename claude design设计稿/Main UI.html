<!doctype html>
<html lang="zh"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主界面 · 债市生存游戏</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="main-ui.css">
<style>html,body{margin:0;background:#07090f;}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="main-ui.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const MainUI = window.MainUI;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="desktop"
        title="主界面 · 桌面"
        subtitle="1440×900 · 三栏布局：左指标+目标 / 中事件+操作 / 右图表+市场脉冲"
      >
        <DCArtboard id="cfo-d" label="CFO · 桌面" width={1440} height={900}>
          <MainUI role="cfo" variant="desktop" />
        </DCArtboard>
        <DCArtboard id="im-d" label="IM · 桌面 · 含红色告警 banner" width={1440} height={900}>
          <MainUI role="im" variant="desktop" />
        </DCArtboard>
        <DCArtboard id="gov-d" label="GOV · 桌面" width={1440} height={900}>
          <MainUI role="gov" variant="desktop" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="mobile"
        title="主界面 · 移动"
        subtitle="375 宽 · 单列堆叠 · 页面整体滚动"
      >
        <DCArtboard id="cfo-m" label="CFO · 移动" width={375} height={1700}>
          <MainUI role="cfo" variant="mobile" />
        </DCArtboard>
        <DCArtboard id="im-m" label="IM · 移动 · 含赎回压力卡" width={375} height={1860}>
          <MainUI role="im" variant="mobile" />
        </DCArtboard>
        <DCArtboard id="gov-m" label="GOV · 移动" width={375} height={1700}>
          <MainUI role="gov" variant="mobile" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
