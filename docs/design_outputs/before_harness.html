<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Before UI Harness</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { generateOrigin } from '/js/origins/index.js';
    import { createInitialState } from '/js/engine.js';
    import { renderFateCard, renderMainScreen, renderEndScreen } from '/js/ui.js';
    import { renderDebtWaterfall, renderCashTrend, renderNavChart, renderHoldingsChart, renderFiscalChart, renderDebtRatioChart } from '/js/charts.js';

    const params = new URLSearchParams(location.search);
    const screen = params.get('screen') || 'fate-cfo';
    const roleId = params.get('role') || (screen.includes('im') ? 'im' : (screen.includes('gov') ? 'gov' : 'cfo'));

    function sampleEvent(role) {
      return {
        id: `main_${role}_sample`,
        title: role === 'im' ? '赎回压力上升，组合流动性承压' : (role === 'gov' ? '化债窗口临近，专项债额度竞争加剧' : '银行收紧城投贷款额度'),
        body: role === 'im'
          ? '理财赎回潮蔓延，信用债成交转弱。组合中的弱资质城投被连续砸盘，净值回撤和客户赎回形成负反馈。'
          : (role === 'gov'
            ? '省里要求本季度上报一揽子化债方案，财政、平台和金融机构需要同时协调，窗口期有限。'
            : '监管窗口指导下发，辖区内商业银行对城投平台新增贷款全面收紧。主开户行通知续做需要总行审批。'),
        choices: [
          { label: '优先稳住短期流动性，牺牲部分收益换确定性', effects: { cash: 1.5, 'score.危机应对': 5 } },
          { label: '主动沟通投资人和金融机构，争取时间窗口', effects: { 'score.合规指数': 4, financingCost: -0.2 } },
          { label: '加快资产处置或仓位调整，接受一定折价', effects: { cash: 2.0, 'score.流动性管理': -2 } },
        ],
      };
    }

    function callbacks(state) {
      return {
        actions: state.role.actions,
        isAvailable: id => state.role.isActionAvailable(state, id),
        onChoiceSelected: () => {},
        onActionSelected: () => {},
        onEndTurn: () => {},
      };
    }

    function buildState(role) {
      const origin = generateOrigin(role);
      const state = createInitialState(origin);
      state.pendingEvent = sampleEvent(role);
      state.history = [
        { year: 2022, quarter: 1, cash: 3.2, nav: 1.0, debtRatio: 240, policyValue: -2 },
        { year: 2022, quarter: 2, cash: 2.8, nav: 0.97, debtRatio: 252, policyValue: -3 },
        { year: 2022, quarter: 3, cash: 2.1, nav: 0.94, debtRatio: 266, policyValue: -4 },
      ];
      if (role === 'im') {
        state.metrics.redemptionPressure = 76;
        state.metrics.nav = 0.9132;
      }
      if (role === 'gov') {
        state.metrics.debtRatio = 286;
        state.metrics.hiddenDebtRisk = 168;
      }
      return state;
    }

    function renderCharts(state) {
      requestAnimationFrame(() => {
        if (state.role.id === 'cfo') {
          renderDebtWaterfall(state);
          renderCashTrend(state);
        } else if (state.role.id === 'im') {
          renderNavChart(state);
          renderHoldingsChart(state);
        } else if (state.role.id === 'gov') {
          renderFiscalChart(state);
          renderDebtRatioChart(state);
        }
      });
    }

    if (screen.startsWith('fate')) {
      const origin = generateOrigin(roleId);
      const state = createInitialState(origin);
      renderFateCard(origin, state.role, () => {});
    } else if (screen === 'end') {
      const state = buildState('cfo');
      state.survived = true;
      state.quartersPassed = 12;
      const finalScore = {
        dimensions: {
          '流动性管理': 82,
          '融资成本控制': 76,
          '项目推进': 69,
          '合规指数': 88,
          '危机应对': 74,
          '综合发展': 71,
        },
        total: 78,
        grade: { grade: 'A', label: '优秀' },
        survived: true,
        quartersPassed: 12,
      };
      renderEndScreen(state, finalScore, {
        rank: 5,
        onRestart: () => {},
        onShare: () => {},
        onLeaderboard: () => {},
      });
    } else {
      const state = buildState(roleId);
      renderMainScreen(state, callbacks(state));
      renderCharts(state);
    }
  </script>
</body>
</html>
